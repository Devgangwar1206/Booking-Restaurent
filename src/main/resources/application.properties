spring.application.name=booking

server.port=${PORT:8050}
spring.jpa.show-sql=true

spring.web.error.include-message=always

# ==============================
# PostgreSQL Database with Defaults
# ==============================
spring.datasource.url=${DB_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/Bookings}}
spring.datasource.username=${DB_USERNAME:${DATASOURCE_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATASOURCE_PASSWORD:root}}

spring.jpa.hibernate.ddl-auto=update

# ==============================
# Frontend URL / CORS
# ==============================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==============================
# Brevo Email API
# ==============================
brevo.api-key=${BREVO_API_KEY:dummy_key}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@example.com}
brevo.sender-name=${BREVO_SENDER_NAME:Royal Spice}
brevo.receiver-email=${CONTACT_RECEIVER:admin@example.com}

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET:dGVzdHNlY3JldGtleWZvcmJvb2tpbmdhcHBsaWNhdGlvbjEyMzQ1Njc4OTA=}

# ==============================
# Table Booking & Redis Configuration
# ==============================
spring.data.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.repositories.enabled=false
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5000ms

booking.restaurant-id=royal_spices_main
booking.hold.duration-minutes=5
booking.cache.availability-ttl-seconds=60

# ==============================
# Razorpay Payment Gateway
# ==============================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummy_secret}

